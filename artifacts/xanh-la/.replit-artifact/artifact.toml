kind = "web"
previewPath = "/"
title = "Xanh Lá — Dinh dưỡng & Sức khỏe"
description = "A Vietnamese nutrition and healthy-living storefront for browsing wellness products, promotions, appointments, and customer accounts."
version = "1.0.0"
id = "artifacts/xanh-la"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21143

[services.development]
run = "pnpm --filter @workspace/xanh-la run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/xanh-la", "run", "build" ]
serve = "static"
publicDir = "artifacts/xanh-la/dist/xanh-la/browser"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21143"
BASE_PATH = "/"
